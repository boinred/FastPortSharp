name: dashboard

# Builds and tests FastPortSharp.Dashboard.sln across macOS + Windows.
# Companion to build.yml (which builds FastPortSharp.sln). Triggered only
# when Dashboard-related or referenced engine (LibCommons/LibNetworks) files
# change, on main and builds/release.
# Design Ref: dashboard-ci-add cycle §3.1.

on:
  push:
    branches:
      - main
      - builds/release
    paths:
      - 'FastPortDashboard.Maui/**'
      - 'FastPortDashboard.Core/**'
      - 'tests-projects/FastPortDashboardTests/**'
      - 'tests-projects/LibTestTelemetry/**'
      - 'LibCommons/**'
      - 'LibNetworks/**'
      # 목적: FastPortDashboard.Core가 template-projects/Protos/*.proto로 Echo 메시지를 생성
      - 'template-projects/Protos/**'
      - 'FastPortSharp.Dashboard.sln'
      - '.github/workflows/dashboard.yml'
  pull_request:
    branches:
      - main
      - builds/release
    paths:
      - 'FastPortDashboard.Maui/**'
      - 'FastPortDashboard.Core/**'
      - 'tests-projects/FastPortDashboardTests/**'
      - 'tests-projects/LibTestTelemetry/**'
      - 'LibCommons/**'
      - 'LibNetworks/**'
      # 목적: FastPortDashboard.Core가 template-projects/Protos/*.proto로 Echo 메시지를 생성
      - 'template-projects/Protos/**'
      - 'FastPortSharp.Dashboard.sln'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    # 목적: branch ruleset 필수 체크에서 build/dashboard job을 구분할 수 있도록 워크플로 접두어 부여
    name: dashboard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # MAUI workload는 macOS + Windows에서만 가능. Linux는 net10.0-maccatalyst /
        # net10.0-windows TFM 둘 다 빌드 불가하므로 matrix 제외.
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Force LF line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet --info
        shell: bash
        run: dotnet --info

      # 목적: workload set 버전 고정. 미지정 시 최신 set(예: 10.0.401.1 → MacCatalyst SDK 27.0)이
      #       설치되어 runner의 Xcode(26.x)와 맞지 않아 빌드 실패. 10.0.401 = MacCatalyst 26.5 + MAUI 10.0.20
      #       (FastPortDashboard.Maui의 Microsoft.Maui.Controls 10.0.20과 일치). 올릴 때는 runner Xcode 버전과 함께 확인.
      - name: Install MAUI workload
        shell: bash
        run: dotnet workload install maui --version 10.0.401

      # 목적: MAUI는 Release에서만 maccatalyst RuntimeIdentifiers(x64/arm64)를 추가하므로,
      #       --no-restore Release build와 같은 Configuration으로 restore해야 NETSDK1047 방지
      - name: Restore
        shell: bash
        run: dotnet restore FastPortSharp.Dashboard.sln -p:Configuration=Release

      - name: Build (Release)
        shell: bash
        run: dotnet build FastPortSharp.Dashboard.sln -c Release --no-restore

      - name: Test (Release)
        shell: bash
        run: dotnet test FastPortSharp.Dashboard.sln -c Release --no-build --logger "console;verbosity=normal"
